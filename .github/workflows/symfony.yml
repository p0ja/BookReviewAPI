name: Symfony CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    # The same database as the app (compose.yaml); the tests create and reset app_test themselves.
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    #  To automatically get bug fixes and new Php versions for shivammathur/setup-php,
    # change this to (see https://github.com/shivammathur/setup-php#bookmark-versioning):
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo_pgsql
        tools: php-cs-fixer, phpunit
    - uses: actions/checkout@v4
    - name: Copy .env.test.local
      run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-
    - name: Install Dependencies
      run: composer -V && composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DATABASE_URL: postgresql://app:postgres@127.0.0.1:5432/app?serverVersion=16&charset=utf8
      run: vendor/bin/phpunit
    - name: Execute code style check
      run: vendor/bin/php-cs-fixer check src
    - name: Static analysis (PHPStan)
      # PHPStan reads the service types from the dev container, built by cache:warmup.
      run: |
        php bin/console cache:warmup --env=dev
        vendor/bin/phpstan analyse --no-progress --memory-limit=1G
