; See https://docs.docker.com/desktop/networking/#i-want-to-connect-from-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; Debugging is enabled per run through XDEBUG_MODE in compose.override.yaml,
; which takes precedence over xdebug.mode, so it is not set here.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.start_with_request = yes
; -1 removes the 512-frame infinite-recursion guard of develop mode
xdebug.max_nesting_level = -1
xdebug.log = /app/var/log/xdebug.log
