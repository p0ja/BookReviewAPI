when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush only once per call of `PersistentObjectFactory::create()`
            flush_once: true

    # If you use the `make:factory --test` command, you may need to uncomment the following.
    # See https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#generate
    #services:
    #    App\Tests\Factory\:
    #        resource: '%kernel.project_dir%/tests/Factory/'
    #        autowire: true
    #        autoconfigure: true

when@test:
    zenstruck_foundry:
        persistence:
            flush_once: true
        orm:
            reset:
                # The test database is built by the migrations, not from the mapping: the
                # expression indexes (uniq_author_name_lower, idx_users_email_lower) exist
                # only in migrations, and without them the tests missed that an author
                # lookup could disagree with the unique index.
                mode: migrate
