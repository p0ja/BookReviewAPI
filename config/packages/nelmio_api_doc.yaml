nelmio_api_doc:
    documentation:
        info:
            title: Book Review API
            description: |
                REST API for books and reviews.

                Every endpoint except /register and /login_check needs a JWT: call /login_check,
                then press "Authorize" and paste the token. Changing or deleting a book, and
                changing an author, needs an admin; a review can be changed or deleted by its
                author or an admin.

                Lists are pages of at most 100 items. Every error is {"error": "..."}; a 422 for
                an invalid payload also lists each problem under "violations". A successful GET
                carries an ETag: send it back as If-None-Match to get 304 when nothing changed.
            version: 1.0.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                Book:
                    type: object
                    properties:
                        id: { type: integer, example: 1 }
                        title: { type: string, example: Clean Architecture }
                        isbn: { type: string, example: '9780134494166' }
                        price: { type: number, format: float, example: 29.99 }
                        description: { type: string, nullable: true }
                        genre: { type: string, example: Software }
                        publish_date: { type: string, format: date, nullable: true, example: '2017-09-10' }
                        authors:
                            type: array
                            items:
                                type: object
                                properties:
                                    id: { type: integer, description: 'Id of the author, see /authors/{id}' }
                                    name: { type: string, example: Robert C. Martin }
                        average_rating: { type: number, format: float, nullable: true, example: 4.33, description: 'Null when the book has no reviews' }
                        review_count: { type: integer, example: 3 }
                Review:
                    type: object
                    properties:
                        review_id: { type: integer, example: 1 }
                        book_id: { type: integer, example: 1 }
                        book_name: { type: string, example: Clean Architecture }
                        user_id: { type: integer, nullable: true, description: 'Who posted the review; null for older reviews. Only that user or an admin can change it' }
                        reviewer: { type: string, nullable: true }
                        content: { type: string }
                        rating: { type: integer, minimum: 0, maximum: 5 }
                        submit_date: { type: string, format: date-time }
                Author:
                    type: object
                    properties:
                        id: { type: integer, example: 1 }
                        name: { type: string, example: Martin Fowler }
                        info: { type: string, nullable: true }
                Account:
                    type: object
                    properties:
                        id: { type: integer, example: 3 }
                        email: { type: string, example: reader@example.com }
                BookPage:
                    type: object
                    properties:
                        items: { type: array, items: { $ref: '#/components/schemas/Book' } }
                        total: { type: integer, description: 'Matches over all pages', example: 42 }
                        page: { type: integer, example: 1 }
                        size: { type: integer, example: 20 }
                ReviewPage:
                    type: object
                    properties:
                        items: { type: array, items: { $ref: '#/components/schemas/Review' } }
                        total: { type: integer, description: 'Matches over all pages', example: 42 }
                        page: { type: integer, example: 1 }
                        size: { type: integer, example: 20 }
                AuthorPage:
                    type: object
                    properties:
                        items: { type: array, items: { $ref: '#/components/schemas/Author' } }
                        total: { type: integer, description: 'Matches over all pages', example: 42 }
                        page: { type: integer, example: 1 }
                        size: { type: integer, example: 20 }
                Error:
                    type: object
                    properties:
                        error: { type: string, example: Resource with such id does not exists }
                        violations:
                            type: array
                            description: 'Only on a 422 for an invalid payload: each violation, also listed one per line in error'
                            items:
                                type: object
                                properties:
                                    field: { type: string, example: isbn }
                                    message: { type: string, example: This field is required. }
                DeleteResult:
                    type: object
                    properties:
                        result: { type: boolean, example: true }
        security:
            - Bearer: []
        paths:
            # json_login handles this route, there is no controller to describe it.
            /login_check:
                post:
                    tags: [Authentication]
                    summary: Get a JWT for an email and password
                    security: []
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required: [username, password]
                                    properties:
                                        username: { type: string, example: user@example.com }
                                        password: { type: string, example: user }
                    responses:
                        '200':
                            description: The token, valid for one hour
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            token: { type: string }
                        '401':
                            description: Invalid credentials
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Error' }
                        '429':
                            description: Too many failed attempts for this email from this address
                            headers:
                                Retry-After:
                                    description: Seconds until a new attempt is accepted (whole minutes, at most 60)
                                    schema: { type: integer }
                            content:
                                application/json:
                                    schema: { $ref: '#/components/schemas/Error' }
    areas:
        # Only the API itself: leaves out the profiler, the error pages and the doc routes.
        path_patterns:
            - ^/(?!_|api/doc)
