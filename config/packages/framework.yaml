# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # Symfony's ErrorListener logs every exception once, before
    # App\EventListener\ExceptionListener renders it; by default 4xx at ERROR and 5xx at
    # CRITICAL. The client errors the API answers on
    # purpose are logged at INFO, so they neither raise alerts nor trigger the prod
    # fingers_crossed handler; anything else keeps the defaults.
    exceptions:
        Symfony\Component\HttpKernel\Exception\BadRequestHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\AccessDeniedHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\ConflictHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\UnprocessableEntityHttpException: { log_level: info }
        Symfony\Component\HttpKernel\Exception\TooManyRequestsHttpException: { log_level: info }

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
